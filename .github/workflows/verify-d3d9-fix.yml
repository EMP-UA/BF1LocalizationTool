# =============================================================================
# UA: НЕЗАЛЕЖНА, ПУБЛІЧНА перевірка походження d3d9.dll — доказ для модерації
#     (NexusMods тощо), що НЕ залежить від машини користувача/модератора.
#     На чистому ubuntu-раннері встановлюється офіційний, портативний
#     компілятор Zig (той самий, що BF1LocalizationTool.Diagnostic
#     довантажує сам собі — MovieSubtitleD3D9FixZigBuilder.cs,
#     GenerateD3D9FixProvenanceReportCommand.cs), з ТОГО САМОГО вихідного
#     коду репозиторію (tools/bf2_d3d9_widescreen_fix/) ЗБИРАЄТЬСЯ d3d9.dll
#     ТОЧНО тим самим задокументованим рецептом (MovieSubtitleD3D9FixZigBuilder.
#     BuildCommand), і результат звіряється БАЙТ-У-БАЙТ із бінарником, що
#     лежить у репозиторії (BF1LocalizationTool.Core/Bf2Widescreen/Data/
#     MovieSubtitleD3D9Fix.dll). Якщо хтось підмінить вбудований бінарник
#     на щось, чого немає у відкритому джерелі поруч, — цей workflow
#     впаде червоним, публічно і незалежно від автора репозиторію.
# EN: An INDEPENDENT, PUBLIC check of d3d9.dll's provenance — evidence for
#     moderation (NexusMods etc) that does NOT depend on the user's or a
#     moderator's own machine. On a clean ubuntu runner, the official,
#     portable Zig compiler is installed (the same one BF1LocalizationTool.
#     Diagnostic downloads for itself — MovieSubtitleD3D9FixZigBuilder.cs,
#     GenerateD3D9FixProvenanceReportCommand.cs), d3d9.dll is built from
#     THIS repository's own source (tools/bf2_d3d9_widescreen_fix/) with the
#     EXACT same documented recipe (MovieSubtitleD3D9FixZigBuilder.
#     BuildCommand), and the result is compared BYTE-FOR-BYTE against the
#     binary committed to the repository (BF1LocalizationTool.Core/
#     Bf2Widescreen/Data/MovieSubtitleD3D9Fix.dll). If anyone ever swaps the
#     bundled binary for something not matching the open source next to it,
#     this workflow fails red, publicly, and independently of the repo's
#     own author.
# =============================================================================
name: Verify d3d9 fix reproducibility

on:
  push:
    branches: ["main"]
    paths:
      - "tools/bf2_d3d9_widescreen_fix/**"
      - "BF1LocalizationTool.Core/Bf2Widescreen/Data/MovieSubtitleD3D9Fix.dll"
      - "BF1LocalizationTool.Core/Bf2Widescreen/MovieSubtitleD3D9FixProvenance.cs"
      - "BF1LocalizationTool.Core/Bf2Widescreen/MovieSubtitleD3D9FixZigBuilder.cs"
      - ".github/workflows/verify-d3d9-fix.yml"
  pull_request:
    paths:
      - "tools/bf2_d3d9_widescreen_fix/**"
      - "BF1LocalizationTool.Core/Bf2Widescreen/Data/MovieSubtitleD3D9Fix.dll"
      - "BF1LocalizationTool.Core/Bf2Widescreen/MovieSubtitleD3D9FixProvenance.cs"
      - "BF1LocalizationTool.Core/Bf2Widescreen/MovieSubtitleD3D9FixZigBuilder.cs"
  workflow_dispatch: {}

jobs:
  verify:
    # UA: Ubuntu, НЕ Windows — саме тут (і саме так) верифіковано рецепт
    #     збірки: офіційний портативний Zig, той самий, яким збирався
    #     бінарник, що лежить у репозиторії (як і в самій програмі —
    #     MovieSubtitleD3D9FixZigBuilder.cs — Zig однаково детерміновано
    #     кросс-компілює під x86-windows-gnu незалежно від хост-ОС).
    # EN: Ubuntu, NOT Windows — this is exactly where (and how) the build
    #     recipe was verified: the official portable Zig compiler, the same
    #     toolchain the binary committed to this repository was built with
    #     (same as inside the program itself — MovieSubtitleD3D9FixZigBuilder.cs
    #     — Zig cross-compiles to x86-windows-gnu deterministically
    #     regardless of the host OS).
    runs-on: ubuntu-latest
    env:
      # UA: Має збігатися з MovieSubtitleD3D9FixZigBuilder.ZigVersion.
      # EN: Must match MovieSubtitleD3D9FixZigBuilder.ZigVersion.
      ZIG_VERSION: "0.16.0"
    steps:
      - name: Checkout / Клонування
        uses: actions/checkout@v4

      - name: Download & verify official Zig (same trust model as MovieSubtitleD3D9FixZigBuilder.cs)
        run: |
          set -euo pipefail
          # UA: Адреса й SHA-256 беруться живцем з офіційного, машинозчитуваного
          #     реєстру релізів https://ziglang.org/download/index.json (не
          #     зашиті наперед у workflow) — той самий принцип довіри, що й у
          #     MovieSubtitleD3D9FixZigBuilder.EnsureZigAvailableAsync.
          # EN: The URL and SHA-256 are read live from the official,
          #     machine-readable release registry https://ziglang.org/download/
          #     index.json (not pinned ahead of time in the workflow) — the
          #     same trust model as MovieSubtitleD3D9FixZigBuilder.
          #     EnsureZigAvailableAsync.
          INDEX=$(curl -fsSL https://ziglang.org/download/index.json)
          URL=$(echo "$INDEX" | jq -r --arg v "$ZIG_VERSION" '.[$v]["x86_64-linux"].tarball')
          SHA=$(echo "$INDEX" | jq -r --arg v "$ZIG_VERSION" '.[$v]["x86_64-linux"].shasum')
          echo "UA: Офіційна адреса Zig $ZIG_VERSION (linux-x86_64): $URL"
          echo "EN: Official Zig $ZIG_VERSION (linux-x86_64) URL: $URL"
          curl -fsSL "$URL" -o zig.tar.xz
          echo "$SHA  zig.tar.xz" | sha256sum -c -
          mkdir -p zig-toolchain
          tar -xf zig.tar.xz -C zig-toolchain --strip-components=1
          echo "$(pwd)/zig-toolchain" >> "$GITHUB_PATH"

      - name: Rebuild d3d9.dll from tools/bf2_d3d9_widescreen_fix/ (exact documented Zig recipe)
        working-directory: tools/bf2_d3d9_widescreen_fix
        # UA: Точно MovieSubtitleD3D9FixZigBuilder.BuildCommand.
        # EN: Exactly MovieSubtitleD3D9FixZigBuilder.BuildCommand.
        run: >
          zig c++ -target x86-windows-gnu -shared -O2 -s
          d3d9_proxy.cpp d3d9_proxy.def -o d3d9.dll

      - name: Compare rebuilt DLL against the one committed to the repo (byte-for-byte)
        run: |
          COMMITTED="BF1LocalizationTool.Core/Bf2Widescreen/Data/MovieSubtitleD3D9Fix.dll"
          REBUILT="tools/bf2_d3d9_widescreen_fix/d3d9.dll"

          echo "UA: SHA-256 вбудованого в репозиторій файла / EN: SHA-256 of the file committed to the repo:"
          sha256sum "$COMMITTED"
          echo "UA: SHA-256 щойно пересібраного файла / EN: SHA-256 of the just-rebuilt file:"
          sha256sum "$REBUILT"

          if cmp -s "$COMMITTED" "$REBUILT"; then
            echo "UA: ЗБІГАЄТЬСЯ БАЙТ-У-БАЙТ — джерело в репозиторії === бінарник у репозиторії."
            echo "EN: MATCHES BYTE-FOR-BYTE — the source in this repo === the binary in this repo."
          else
            echo "UA: НЕ ЗБІГАЄТЬСЯ! Вбудований бінарник НЕ відповідає джерелу поруч у репозиторії."
            echo "EN: DOES NOT MATCH! The committed binary does NOT correspond to the source next to it in this repository."
            exit 1
          fi

      - name: Sanity-check exports/imports/format (objdump)
        # UA: Звичайний системний objdump (binutils, він уже є на ubuntu-latest)
        #     читає PE/COFF так само добре — окремий цільовий objdump не
        #     потрібен.
        # EN: The plain system objdump (binutils, already on ubuntu-latest)
        #     reads PE/COFF just fine — no separate target-specific objdump
        #     is needed.
        run: objdump -p tools/bf2_d3d9_widescreen_fix/d3d9.dll

      - name: Upload rebuilt DLL as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: d3d9-rebuilt-from-source
          path: tools/bf2_d3d9_widescreen_fix/d3d9.dll
          retention-days: 90
